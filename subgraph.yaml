specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: StablecoinVault
    network: mainnet
    source:
      address: "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
      abi: StablecoinVault
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AdminUpdated
        - Deposited
        - GovernanceUpdated
        - RedeemExecuted
        - TokenConfigUpdated
        - TreasuryTransferred
      abis:
        - name: StablecoinVault
          file: ./abis/StablecoinVault.json
      eventHandlers:
        - event: AdminUpdated(indexed address,indexed address)
          handler: handleAdminUpdated
        - event: Deposited(indexed uint256,indexed address,indexed address,uint256,uint256)
          handler: handleDeposited
        - event: GovernanceUpdated(indexed address,indexed address)
          handler: handleGovernanceUpdated
        - event: RedeemExecuted(indexed uint256,indexed address,indexed address,address,uint256,bytes32)
          handler: handleRedeemExecuted
        - event: TokenConfigUpdated(indexed address,bool,uint256)
          handler: handleTokenConfigUpdated
        - event: TreasuryTransferred(indexed address,indexed address,uint256,bytes32)
          handler: handleTreasuryTransferred
      file: ./src/stablecoin-vault.ts
